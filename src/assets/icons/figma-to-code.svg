<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <!-- Code Bracket Gradient -->
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="240" height="240" rx="40" fill="url(#bgGrad)" />

  <!-- Figma Shapes (Left Side) -->
  <g transform="translate(45, 65) scale(0.45)">
    <path d="M 0,50 A 50,50 0 0,1 50,0 L 100,0 L 100,100 L 50,100 A 50,50 0 0,1 0,50 Z" fill="#F24E1E"/>
    <path d="M 150,50 A 50,50 0 1,1 100,0 L 100,100 Z" fill="#FF7262"/>
    <path d="M 0,150 A 50,50 0 0,1 50,100 L 100,100 L 100,200 L 50,200 A 50,50 0 0,1 0,150 Z" fill="#A259FF"/>
    <circle cx="150" cy="150" r="50" fill="#1ABC9C"/>
    <path d="M 0,250 A 50,50 0 0,1 50,200 L 100,200 L 100,250 A 50,50 0 0,1 50,300 A 50,50 0 0,1 0,250 Z" fill="#0ACF83"/>
  </g>

  <!-- Connecting Magic Wand / Arrow -->
  <path d="M 110,120 L 130,120" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Code Brackets (Right Side) -->
  <g transform="translate(135, 90)">
    <path d="M 25,10 L 5,30 L 25,50" fill="none" stroke="url(#codeGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 40,10 L 20,50" fill="none" stroke="#a78bfa" stroke-width="6" stroke-linecap="round"/>
    <path d="M 35,10 L 55,30 L 35,50" fill="none" stroke="url(#codeGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
